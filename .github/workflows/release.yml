# Two environments, each always FE+BE from the same commit:
#   main push            → backend-dev    + site at …/self-hosted-captioning/dev/
#   v* tag / manual prod → backend-latest + site at …/self-hosted-captioning/
# Pages is one artifact with both trees, so publishing one side keeps the other.
#
# GitHub Pages dedupes by pages_build_version. actions/deploy-pages always uses
# GITHUB_SHA for that (and the runner will not let a step override GITHUB_SHA), so
# main→dev then a v* tag on the same commit would keep the first artifact. We deploy
# via the Pages API with a fresh empty-commit SHA as the build version (deploy-pages#383).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Which environment to publish (dev tracks main; prod is the live site)
        type: choice
        options: [dev, prod]
        default: prod
      ref:
        description: Commit, tag or branch to publish (leave blank for this run's default; use an older commit to roll back)
        required: false
        default: ""

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      sha: ${{ steps.sha.outputs.sha }}
      short: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the commit to publish
        if: inputs.ref != ''
        run: git checkout --detach "$REF"
        env:
          REF: ${{ inputs.ref }}

      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - id: channel
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "channel=none" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend
        working-directory: backend
        env:
          VERSION: ${{ steps.sha.outputs.short }}
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run bundle
          sha256sum server.mjs > server.mjs.sha256
          node -e "import('./server.mjs').then(m => { if (typeof m.start !== 'function' || typeof m.stop !== 'function') process.exit(1) })"

      - name: Frontend
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - if: steps.channel.outputs.channel != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: backend
          path: |
            backend/server.mjs
            backend/server.mjs.sha256

  # Upload this channel's server + site.tar.gz. Assemble Pages only when it won't wipe the other side.
  publish:
    needs: check
    if: needs.check.outputs.channel != 'none'
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.ready }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.check.outputs.channel }}
      SHORT: ${{ needs.check.outputs.short }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: backend

      - name: Build this channel's site
        working-directory: frontend
        env:
          VITE_BASE: ${{ needs.check.outputs.channel == 'prod' && format('/{0}/', github.event.repository.name) || format('/{0}/dev/', github.event.repository.name) }}
        run: |
          npm ci
          npm run build
          printf '%s\n' "$SHA" > dist/COMMIT
          tar -C dist -czf "$GITHUB_WORKSPACE/site.tar.gz" .

      - name: Assemble Pages (prod at /,dev at /dev/)
        id: pages
        run: |
          set -euo pipefail
          mkdir -p site/dev
          if [ "$CHANNEL" = "prod" ]; then
            OTHER=backend-dev
          else
            OTHER=backend-latest
          fi

          HAS_OTHER=0
          if gh release download "$OTHER" --pattern site.tar.gz --output other-site.tar.gz 2>/dev/null; then
            HAS_OTHER=1
            if [ "$CHANNEL" = "prod" ]; then
              tar -xzf other-site.tar.gz -C site/dev
            else
              tar -xzf other-site.tar.gz -C site
            fi
          else
            echo "No $OTHER site.tar.gz yet."
          fi

          # A_dev publish without a saved prod site would wipe the live Pages root.
          if [ "$CHANNEL" = "dev" ] && [ "$HAS_OTHER" -eq 0 ]; then
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deploy until prod has published site.tar.gz once." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

          if [ "$CHANNEL" = "prod" ]; then
            tar -xzf site.tar.gz -C site
          else
            tar -xzf site.tar.gz -C site/dev
          fi

      - name: Publish backend + site for this channel
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "prod" ]; then
            TAG=backend-latest
            TITLE="Backend + site (live)"
            NOTES="Live venue servers and the public site. FE and BE are the same commit. Cut by a v* tag or a manual Release run."
          else
            TAG=backend-dev
            TITLE="Backend + site (dev)"
            NOTES="Dev venue servers (UPDATE_URL → this release) and the /dev/ site. FE and BE are the same commit. Updated on every push to main."
          fi
          {
            echo "$NOTES"
            echo
            echo "Commit: \`$SHA\` (\`$SHORT\`)."
          } > /tmp/notes.md
          # Move the mutable tag to this commit. Cloud Shell opens these tags for setup.sh;
          # uploading assets alone left the tag on an old SHA.
          git tag -f "$TAG" "$SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md --target "$SHA"
          else
            gh release create "$TAG" --target "$SHA" --title "$TITLE" --latest=false --notes-file /tmp/notes.md
          fi
          gh release upload "$TAG" server.mjs server.mjs.sha256 site.tar.gz --clobber
          echo "Published $TAG from $SHORT" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.pages.outputs.ready == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pages
          path: site

  pages:
    needs: [check, publish]
    if: needs.publish.outputs.pages == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pages
          path: site

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Not actions/deploy-pages: it always uses GITHUB_SHA as pages_build_version (and the
      # runner will not let a step override GITHUB_SHA), so main→dev then a v* tag on that
      # commit keeps the first artifact. Create a unique empty commit SHA for pages_build_version
      # (the API 404s on non-commit strings) and deploy with that.
      - id: deploy
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          CHANNEL: ${{ needs.check.outputs.channel }}
        with:
          script: |
            const artifactId = process.env.ARTIFACT_ID
            if (!artifactId) throw new Error('upload-pages-artifact did not return artifact_id')
            const oidc = await core.getIDToken()
            // pages_build_version must be a real commit SHA in the repo (other strings 404).
            // Make a unique empty commit so main→dev then a same-SHA tag both publish.
            const { data: head } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            })
            const { data: empty } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `pages:${process.env.CHANNEL || 'site'}:${artifactId}`,
              tree: head.tree.sha,
              parents: [context.sha],
            })
            const buildVersion = empty.sha
            core.info(`Deploying Pages artifact ${artifactId} as build ${buildVersion}`)
            const { data: created } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: Number(artifactId),
              pages_build_version: buildVersion,
              oidc_token: oidc,
            })
            const id = created.id
            core.info(`Created deployment ${id}`)
            core.setOutput('page_url', created.page_url || `https://${context.repo.owner}.github.io/${context.repo.repo}/`)
            const deadline = Date.now() + 10 * 60 * 1000
            let interval = 5000
            while (Date.now() < deadline) {
              await new Promise((r) => setTimeout(r, interval))
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deploymentId: id,
              })
              core.info(`Pages status: ${data.status}`)
              if (data.status === 'succeed') {
                core.info('Reported success!')
                return
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                throw new Error(`Pages deploy failed: ${data.status}`)
              }
              interval = Math.min(Math.round(interval * 1.5), 30000)
            }
            throw new Error(`Timed out waiting for Pages deploy ${id}`)
